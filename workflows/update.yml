name: Update news
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python collector.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NEWS_APP_URL: ${{ vars.NEWS_APP_URL }}
      - run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json channel_ids.json
          git diff --cached --quiet || (git commit -m "Update news" && git push)
